[tool.poetry]
name = "py-db-migrate"
version = "0.3.1"
description = "The CLI application for managing SQL migrations."
authors = ["akemalyildirim1 <akemalyildirim1@gmail.com>"]
readme = "README.md"
repository = "https://github.com/akemalyildirim1/py-db-migrate"
keywords = ["psql", "sql", "migration", "typer", "python"]

[tool.poetry.urls]
"Issue tracker" = "https://github.com/akemalyildirim1/py-db-migrate/issues"

[tool.poetry.scripts]
py-db-migrate = "py_db_migrate.main:app"

[tool.poetry.dependencies]
python = "^3.12"
aiofiles = "^24.1.0"
asyncpg = "^0.29.0"
overrides = "^7.4.0"
pydantic = "^2.3.0"
pyyaml = "^6.0.1"
typer = "^0.12.3"
pypika = "^0.48.9"

[tool.poetry.group.dev.dependencies]
coverage = "^7.3.0"
pre-commit = "^3.3.3"
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
types-aiofiles = "^24.1.0.20240626"
types-pyyaml = "^6.0.12.11"
mypy = "^1.5.1"
ruff = "^0.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
exclude = ["tests"]

[tool.ruff.lint]
select = [
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict_optional = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.3.1"
tag_format = "$version"
version_files = ["pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
